<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taller IA</title>
<meta name="description" content="Asistente de diagnóstico de averías de Talleres Gallardo">
<meta name="theme-color" content="#17191C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Taller IA">
<meta name="format-detection" content="telephone=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
</head>
<body>

<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <defs>
    <symbol id="i-mic" viewBox="0 0 24 24"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></symbol>
    <symbol id="i-stop" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2.5" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></symbol>
    <symbol id="i-video" viewBox="0 0 24 24"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></symbol>
    <symbol id="i-type" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></symbol>
    <symbol id="i-vol" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="5" r="1.4" fill="currentColor"/><circle cx="12" cy="19" r="1.4" fill="currentColor"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" fill="currentColor"/><rect x="14" y="4" width="4" height="16" fill="currentColor"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
    <symbol id="i-zap" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></symbol>
    <symbol id="i-flip" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></symbol>
    <symbol id="i-ext" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></symbol>
    <symbol id="i-warn" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></symbol>
    <symbol id="i-out" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></symbol>
    <symbol id="i-retry" viewBox="0 0 24 24"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></symbol>
  </defs>
</svg>

<div class="app" id="app">
  <aside class="rail-cars" id="railCars" aria-label="Coches"></aside>

  <div class="work">
    <header class="top">
      <button class="top-car" id="carBtn" type="button" aria-haspopup="dialog">
        <span class="top-name" id="carName">Coche 1</span>
        <svg class="ic top-chev" aria-hidden="true"><use href="#i-chev"/></svg>
        <span class="top-sub" id="carSub">Sin consultas todavía</span>
      </button>
      <button class="top-btn" id="voiceBtn" type="button" aria-pressed="true" aria-label="Leer las respuestas en voz alta"><svg class="ic" aria-hidden="true"><use href="#i-vol"/></svg></button>
      <button class="top-btn" id="menuBtn" type="button" aria-label="Más opciones"><svg class="ic" aria-hidden="true"><use href="#i-more"/></svg></button>
    </header>

    <div class="net" id="net" hidden>Sin conexión. Lo que envíes saldrá solo en cuanto vuelva.</div>
    <div class="news" id="news" role="status" hidden><span class="news-dot" aria-hidden="true"></span><span id="newsMsg"></span><button class="btn btn-go" id="newsGo" type="button">Ver</button><button class="news-x" id="newsX" type="button" aria-label="Cerrar el aviso"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button></div>

    <main class="chat" id="chat" tabindex="-1"></main>

    <section class="tray" id="tray" hidden aria-label="Adjuntos por enviar">
      <div class="tray-list" id="trayList"></div>
      <button class="btn btn-go" id="traySend" type="button">Enviar</button>
    </section>

    <footer class="dock" id="dock">
      <div class="dock-voice" id="dockVoice">
        <button class="key" id="photoBtn" type="button"><svg class="ic" aria-hidden="true"><use href="#i-camera"/></svg><span>Foto</span></button>
        <button class="key" id="videoBtn" type="button"><svg class="ic" aria-hidden="true"><use href="#i-video"/></svg><span>Vídeo</span></button>
        <button class="key rec-cancel" id="recCancel" type="button"><svg class="ic" aria-hidden="true"><use href="#i-trash"/></svg><span>Descartar</span></button>
        <button class="ptt" id="ptt" type="button" aria-label="Grabar nota de voz">
          <svg class="ptt-ring" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="56" pathLength="100"/></svg>
          <svg class="ic ptt-mic" aria-hidden="true"><use href="#i-mic"/></svg>
          <svg class="ic ptt-stop" aria-hidden="true"><use href="#i-stop"/></svg>
        </button>
        <div class="rec-info" id="recInfo" aria-hidden="true"><b id="recTime">0:00</b><canvas id="recWave" width="120" height="28"></canvas></div>
        <button class="key" id="galleryBtn" type="button"><svg class="ic" aria-hidden="true"><use href="#i-image"/></svg><span>Galería</span></button>
        <button class="key" id="typeBtn" type="button"><svg class="ic" aria-hidden="true"><use href="#i-type"/></svg><span>Escribir</span></button>
      </div>
      <div class="dock-text" id="dockText" hidden>
        <button class="key key-sq" id="backVoice" type="button" aria-label="Volver al micro"><svg class="ic" aria-hidden="true"><use href="#i-mic"/></svg></button>
        <textarea id="txt" rows="1" placeholder="Escribe qué le pasa…" enterkeyhint="send" autocomplete="off" aria-label="Mensaje"></textarea>
        <button class="btn btn-go btn-round" id="sendTxt" type="button" aria-label="Enviar"><svg class="ic" aria-hidden="true"><use href="#i-up"/></svg></button>
      </div>
      <p class="hint" id="hint" aria-live="polite"></p>
      <button class="replay listen" id="replay" type="button" hidden><svg class="ic" aria-hidden="true"><use href="#i-vol"/></svg><span>Repetir respuesta</span></button>
    </footer>
  </div>
</div>

<!-- PIN / conexión -->
<div class="lock" id="lock" hidden>
  <div class="lock-in">
    <img class="lock-logo" src="icons/icon.svg" alt="" width="84" height="84">
    <h1>Taller IA</h1>
    <p class="lock-msg" id="lockMsg">Escribe el PIN del taller</p>
    <div id="lockPin">
      <div class="dots" id="dots" aria-hidden="true"></div>
      <div class="pad" id="pad"></div>
    </div>
    <form id="lockSetup" hidden>
      <button class="btn btn-go" type="button" id="invitePaste">Pegar el enlace copiado</button>
      <input id="inviteInput" type="url" inputmode="url" autocomplete="off" placeholder="Pega aquí el enlace de invitación" aria-label="Enlace de invitación">
      <button class="btn btn-quiet" type="submit">Conectar</button>
      <a class="lock-demo" href="?demo=1">Ver una demostración</a>
    </form>
  </div>
</div>

<!-- Cámara -->
<div class="cam" id="cam" hidden>
  <video id="camVideo" playsinline muted autoplay></video>
  <div class="cam-flash" id="camFlash"></div>
  <div class="cam-top">
    <button class="cam-btn" id="camClose" type="button" aria-label="Cerrar la cámara"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
    <div class="cam-timer" id="camTimer" hidden><i></i><span id="camTime">0:00</span></div>
    <p class="cam-note" id="camNote" role="status" hidden>Diagnóstico listo: te lo leo al terminar</p>
    <div class="cam-top-r">
      <button class="cam-btn" id="camTorch" type="button" aria-pressed="false" aria-label="Linterna" hidden><svg class="ic" aria-hidden="true"><use href="#i-zap"/></svg></button>
      <button class="cam-btn" id="camFlip" type="button" aria-label="Cambiar de cámara"><svg class="ic" aria-hidden="true"><use href="#i-flip"/></svg></button>
    </div>
  </div>
  <div class="cam-err" id="camErr" hidden>
    <p id="camErrMsg"></p>
    <button class="btn btn-go" id="camNative" type="button">Abrir la cámara del móvil</button>
    <button class="btn btn-quiet" id="camRetry" type="button">Probar otra vez</button>
  </div>
  <div class="cam-bottom">
    <div class="cam-modes" id="camModes" role="tablist">
      <button type="button" role="tab" data-mode="photo" aria-selected="true">Foto</button>
      <button type="button" role="tab" data-mode="video" aria-selected="false">Vídeo</button>
    </div>
    <div class="cam-row">
      <!-- Micro a la izquierda y obturador en el centro: otro color, otra forma y separados para no confundirlos con el pulgar -->
      <div class="cam-mic-wrap">
        <button class="cam-mic" id="camMic" type="button" aria-label="Explicar por voz mientras haces fotos: mantén pulsado, o pulsa para empezar y otra vez para enviar">
          <svg class="ic cam-mic-ic" aria-hidden="true"><use href="#i-mic"/></svg>
          <svg class="ic cam-mic-stop" aria-hidden="true"><use href="#i-stop"/></svg>
        </button>
        <span class="cam-mic-lbl" id="camMicLbl" aria-live="polite">Explicar</span>
      </div>
      <button class="shutter" id="shutter" type="button" aria-label="Hacer la foto">
        <svg class="shutter-ring" viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="56" pathLength="100"/></svg>
        <i></i>
      </button>
      <div class="cam-end">
        <button class="cam-stack" id="camStack" type="button" aria-label="Ver las capturas" hidden><img id="camStackImg" alt=""><b id="camStackN">0</b></button>
        <button class="cam-done" id="camDone" type="button" hidden>Listo</button>
      </div>
    </div>
  </div>
</div>

<!-- Hoja inferior genérica -->
<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" tabindex="-1">
    <button class="sheet-x" id="sheetX" type="button" aria-label="Cerrar"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button>
    <div id="sheetBody"></div>
  </div>
</div>

<div class="lightbox" id="lightbox" hidden><img id="lightboxImg" alt="Foto enviada"><button class="cam-btn" id="lightboxX" type="button" aria-label="Cerrar"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg></button></div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden><span id="toastMsg"></span><button id="toastAct" type="button" hidden></button></div>

<input class="off" type="file" id="pick" multiple accept="image/*,video/*,audio/*" tabindex="-1" aria-hidden="true">
<input class="off" type="file" id="capPhoto" accept="image/*" capture="environment" tabindex="-1" aria-hidden="true">
<input class="off" type="file" id="capVideo" accept="video/*" capture="environment" tabindex="-1" aria-hidden="true">

<script src="config.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
